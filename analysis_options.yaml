include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "lib/l10n/app_localizations*.dart"
    - "build/**"
    # Hodinky jsou samostatný projekt s vlastními balíčky – kontroluj je
    # ve složce wear/ (cd wear; flutter analyze).
    - "wear/**"
    # Web pro trenéry má vlastní balíčky (cd trainer_web; flutter analyze).
    - "trainer_web/**"
    # Pojistka proti staré kopii projektu rozbalené do podsložky.
    - "fitness_app/**"
    - "functions/**"

linter:
  rules:
    prefer_single_quotes: true
    prefer_const_constructors: true
    always_declare_return_types: true
