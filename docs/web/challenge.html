<!doctype html>
<!--
  Stránka výzvy: <web>/challenge?e=<slug|id>&v=<kg>&r=<opakování>&n=<jméno>&d=<rrrr-mm-dd>[&x=<název cviku>]
  v × r = nejtěžší série vyzývajícího (lib/modules/sharing/challenge_link.dart).
  Na webu běží jako https://gymbar.app/challenge (Firebase Hosting, cleanUrls
  ve firebase.json). Odkazy do obchodů a schéma aplikace jsou v config.js.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GymBar – Challenge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GymBar">
  <meta property="og:title" content="💪 GymBar challenge · Výzva">
  <meta property="og:description" content="Can you beat my lift? · Překonáš můj výkon?">
  <meta property="og:url" content="https://gymbar.app/challenge">
  <meta property="og:image" content="https://gymbar.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg1: #13201d;
      --bg2: #1f4a40;
      --accent: #ffc857;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.8);
      --card: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    html { background: #13201d; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    main { width: 100%; max-width: 440px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; color: inherit; text-decoration: none; }
    .brand img { width: 34px; height: 34px; flex: none; }
    .brand .bar { color: var(--accent); }
    .label {
      margin-top: 32px; color: var(--accent); font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; font-size: 13px;
    }
    h1 { font-size: 28px; line-height: 1.2; margin: 8px 0 20px; }
    .card { background: var(--card); border-radius: 16px; padding: 20px; }
    .exercise { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
    .value { font-size: 56px; font-weight: 800; color: var(--accent); line-height: 1.1; }
    .value small { font-size: 24px; }
    .value .reps { font-size: 36px; color: var(--text); margin-left: 12px; }
    .muted { color: var(--muted); font-size: 15px; margin: 8px 0 0; }
    .buttons { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
    a.btn {
      display: block; text-align: center; text-decoration: none; border-radius: 999px;
      padding: 14px 20px; font-weight: 700; font-size: 16px;
    }
    a.primary { background: var(--accent); color: #13201d; }
    a.secondary { border: 1px solid rgba(255, 255, 255, 0.6); color: var(--text); }
    .stores { display: flex; gap: 12px; }
    .stores a { flex: 1; }
    .stores a.soon { border-style: dashed; color: var(--muted); cursor: default; font-weight: 600; font-size: 14px; }
    .hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 12px; }
    .error { display: none; }
  </style>
</head>
<body>
<main>
  <a class="brand" href="/">
    <img src="/favicon.svg" alt="">
    <span id="appName">Gym<span class="bar">Bar</span></span>
  </a>

  <section id="challenge">
    <div class="label" id="label"></div>
    <h1 id="title"></h1>
    <div class="card">
      <p class="exercise" id="exercise"></p>
      <div class="value"><span id="value"></span> <small>kg</small><span class="reps" id="reps"></span></div>
      <p class="muted" id="goal"></p>
      <p class="muted" id="deadline"></p>
    </div>
  </section>

  <section id="error" class="error">
    <h1 id="errorText"></h1>
  </section>

  <div class="buttons">
    <a class="btn primary" id="openApp" href="#"></a>
    <div class="stores">
      <a class="btn secondary" id="playStore" data-store="play" href="#"></a>
      <a class="btn secondary" id="appStore" data-store="apple" href="#"></a>
    </div>
    <p class="hint" id="hint"></p>
  </div>
</main>

<script src="/config.js"></script>
<script src="/site.js"></script>
<script>
(function () {
  var APP_SCHEME = window.GYMBAR.scheme;

  var T = {
    en: {
      label: 'Challenge',
      from: '{name} challenges you!',
      anon: 'A friend challenges you!',
      goal: 'Beat it: more weight, or more reps at the same weight.',
      deadline: 'Until {date}',
      open: 'Open in app',
      play: 'Google Play',
      apple: 'App Store',
      hint: "Don't have the app yet? Get it, then open this link again.",
      invalid: "This challenge link doesn't work.",
      unknown: 'Exercise'
    },
    cs: {
      label: 'Výzva',
      from: '{name} tě vyzývá!',
      anon: 'Kamarád tě vyzývá!',
      goal: 'Překonej to: víc kg, nebo stejná váha na víc opakování.',
      deadline: 'Do {date}',
      open: 'Otevřít v aplikaci',
      play: 'Google Play',
      apple: 'App Store',
      hint: 'Aplikaci ještě nemáš? Stáhni si ji a pak otevři tenhle odkaz znovu.',
      invalid: 'Tenhle odkaz na výzvu nefunguje.',
      unknown: 'Cvik'
    },
    de: {
      label: 'Challenge',
      from: '{name} fordert dich heraus!',
      anon: 'Ein Freund fordert dich heraus!',
      goal: 'Übertriff das: mehr Gewicht oder mehr Wiederholungen mit demselben Gewicht.',
      deadline: 'Bis {date}',
      open: 'In der App öffnen',
      play: 'Google Play',
      apple: 'App Store',
      hint: 'Du hast die App noch nicht? Lade sie herunter und öffne den Link dann erneut.',
      invalid: 'Dieser Challenge-Link funktioniert nicht.',
      unknown: 'Übung'
    },
    es: {
      label: 'Reto',
      from: '¡{name} te reta!',
      anon: '¡Un amigo te reta!',
      goal: 'Supéralo: más peso, o más repeticiones con el mismo peso.',
      deadline: 'Hasta el {date}',
      open: 'Abrir en la app',
      play: 'Google Play',
      apple: 'App Store',
      hint: '¿Aún no tienes la app? Descárgala y vuelve a abrir este enlace.',
      invalid: 'Este enlace de reto no funciona.',
      unknown: 'Ejercicio'
    },
    fr: {
      label: 'Défi',
      from: '{name} te lance un défi !',
      anon: 'Un ami te lance un défi !',
      goal: 'Fais mieux : plus lourd, ou plus de répétitions au même poids.',
      deadline: "Jusqu'au {date}",
      open: "Ouvrir dans l'app",
      play: 'Google Play',
      apple: 'App Store',
      hint: "Tu n'as pas encore l'app ? Télécharge-la puis rouvre ce lien.",
      invalid: 'Ce lien de défi ne fonctionne pas.',
      unknown: 'Exercice'
    },
    sk: {
      label: 'Výzva',
      from: '{name} ťa vyzýva!',
      anon: 'Kamarát ťa vyzýva!',
      goal: 'Prekonaj to: viac kg alebo rovnaká váha na viac opakovaní.',
      deadline: 'Do {date}',
      open: 'Otvoriť v aplikácii',
      play: 'Google Play',
      apple: 'App Store',
      hint: 'Aplikáciu ešte nemáš? Stiahni si ju a potom otvor tento odkaz znova.',
      invalid: 'Tento odkaz na výzvu nefunguje.',
      unknown: 'Cvik'
    },
    pl: {
      label: 'Wyzwanie',
      from: '{name} rzuca ci wyzwanie!',
      anon: 'Znajomy rzuca ci wyzwanie!',
      goal: 'Pobij to: większy ciężar albo więcej powtórzeń z tym samym ciężarem.',
      deadline: 'Do {date}',
      open: 'Otwórz w aplikacji',
      play: 'Google Play',
      apple: 'App Store',
      hint: 'Nie masz jeszcze aplikacji? Pobierz ją, a potem otwórz ten link ponownie.',
      invalid: 'Ten link do wyzwania nie działa.',
      unknown: 'Ćwiczenie'
    },
    it: {
      label: 'Sfida',
      from: '{name} ti sfida!',
      anon: 'Un amico ti sfida!',
      goal: 'Superalo: più peso, o più ripetizioni con lo stesso peso.',
      deadline: 'Entro il {date}',
      open: "Apri nell'app",
      play: 'Google Play',
      apple: 'App Store',
      hint: "Non hai ancora l'app? Scaricala e poi riapri questo link.",
      invalid: 'Questo link della sfida non funziona.',
      unknown: 'Esercizio'
    },
    nl: {
      label: 'Uitdaging',
      from: '{name} daagt je uit!',
      anon: 'Een vriend daagt je uit!',
      goal: 'Versla dit: meer gewicht, of meer herhalingen met hetzelfde gewicht.',
      deadline: 'Tot {date}',
      open: 'Openen in de app',
      play: 'Google Play',
      apple: 'App Store',
      hint: 'Heb je de app nog niet? Download hem en open deze link daarna opnieuw.',
      invalid: 'Deze uitdagingslink werkt niet.',
      unknown: 'Oefening'
    },
    // pt = brazilská portugalština (Intl.DateTimeFormat('pt') je pt-BR).
    pt: {
      label: 'Desafio',
      from: '{name} desafia você!',
      anon: 'Um amigo desafia você!',
      goal: 'Supere: mais peso, ou mais repetições com o mesmo peso.',
      deadline: 'Até {date}',
      open: 'Abrir no app',
      play: 'Google Play',
      apple: 'App Store',
      hint: 'Ainda não tem o app? Baixe e depois abra este link de novo.',
      invalid: 'Este link de desafio não funciona.',
      unknown: 'Exercício'
    }
  };

  // Stejné limity jako ChallengeLink v aplikaci (challenge_link.dart).
  var MAX_EXERCISE = 64;   // e (slug / id) i x (název vlastního cviku)
  var MAX_NAME = 40;       // n (jméno vyzývajícího)

  // ?lang=, jazyk zvolený na webu, nebo jazyk prohlížeče (site.js).
  var lang = window.GYMBAR.pickLang(Object.keys(T), false);
  var t = T[lang];
  document.documentElement.lang = lang;

  function text(id, value) { document.getElementById(id).textContent = value; }

  // Dosazení do textu přes split/join – String.replace by ve jméně
  // vykládal „$&“, „$1“… jako speciální vzory.
  function fill(template, key, value) {
    return template.split(key).join(value);
  }

  // Ořízne mezery a zkrátí na max jednotek UTF-16 (jako _clean v aplikaci);
  // rozpůlené emoji na konci zahodí.
  function clip(value, max) {
    var s = String(value || '').trim();
    if (s.length <= max) return s;
    s = s.slice(0, max);
    var last = s.charCodeAt(s.length - 1);
    if (last >= 0xD800 && last <= 0xDBFF) s = s.slice(0, -1);
    return s.replace(/\s+$/, '');
  }

  // „2026-10-30“ → Date; neplatné datum (např. 2026-02-31, které by Date
  // posunul na 3. března) → null. Stejně jako ChallengeLink.parseDate.
  function parseDate(value) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    if (!m) return null;
    var y = +m[1], mo = +m[2], day = +m[3];
    var date = new Date(y, mo - 1, day);
    if (date.getFullYear() !== y || date.getMonth() !== mo - 1 ||
        date.getDate() !== day) {
      return null;
    }
    return date;
  }

  function humanize(slug) {
    var s = String(slug).replace(/[_\-]+/g, ' ').trim();
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  }

  var params = new URLSearchParams(window.location.search);
  var e = (params.get('e') || '').trim();
  // Číslo musí být celý text (jako double.tryParse v aplikaci) –
  // parseFloat by přijal i „80kg“, který aplikace odmítne.
  var vRaw = (params.get('v') || '').replace(',', '.').trim();
  var v = vRaw ? Number(vRaw) : NaN;
  var n = clip(params.get('n'), MAX_NAME);
  var x = clip(params.get('x'), MAX_EXERCISE);
  var d = (params.get('d') || '').trim();
  // Opakování rekordní série (1–999, jinak se neukazují).
  var r = parseInt(params.get('r') || '', 10);
  var reps = isFinite(r) && r >= 1 && r <= 999 ? r : null;

  text('openApp', t.open);
  text('playStore', t.play);
  text('appStore', t.apple);
  text('hint', t.hint);
  // Odkazy do obchodů, nebo „již brzy“ podle config.js.
  window.GYMBAR.storeButtons(lang);

  var valid = e && e.length <= MAX_EXERCISE && isFinite(v) && v > 0 && v <= 1000;
  if (!valid) {
    document.getElementById('challenge').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('openApp').style.display = 'none';
    text('errorText', t.invalid);
    return;
  }

  // Odkaz do aplikace se stejnými parametry.
  document.getElementById('openApp').href =
    APP_SCHEME + '://challenge?' + params.toString();

  text('label', t.label);
  var heading = n ? fill(t.from, '{name}', n) : t.anon;
  text('title', heading);
  document.title = heading + ' – ' +
    document.getElementById('appName').textContent;
  // Číselné ID = vlastní cvik; název pak nese parametr x.
  var exerciseName = x || (/^\d+$/.test(e) ? t.unknown : humanize(e));
  text('exercise', exerciseName);
  text('value', new Intl.NumberFormat(lang, { maximumFractionDigits: 2 }).format(v));
  if (reps) text('reps', '× ' + reps);
  text('goal', t.goal);

  var date = parseDate(d);
  if (date) {
    text('deadline', fill(t.deadline, '{date}',
      new Intl.DateTimeFormat(lang, { dateStyle: 'long' }).format(date)));
  }
})();
</script>
</body>
</html>
