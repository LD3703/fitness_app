<!doctype html>
<!--
  Pozvánka mezi přátele a do žebříčku posilovny:
    https://gymbar.app/friend?code=XXXXXXXX
    https://gymbar.app/gym?code=XXXXXX
  Obě adresy sem přesměruje firebase.json (rewrites). Stránka nabídne otevření
  aplikace (gymbar://friend?code=… / gymbar://gym?code=…) nebo stažení
  z obchodu. Odkazy do obchodů a schéma aplikace jsou v config.js.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GymBar</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GymBar">
  <meta property="og:title" content="GymBar – join me · Přidej se">
  <meta property="og:description" content="Add me as a friend or join our gym leaderboard. · Přidej si mě do přátel nebo se připoj k žebříčku posilovny.">
  <meta property="og:url" content="https://gymbar.app">
  <meta property="og:image" content="https://gymbar.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg1: #13201d;
      --bg2: #1f4a40;
      --accent: #ffc857;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.8);
      --card: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    html { background: #13201d; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    main { width: 100%; max-width: 440px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; color: inherit; text-decoration: none; }
    .brand img { width: 34px; height: 34px; flex: none; }
    .brand .bar { color: var(--accent); }
    .label {
      margin-top: 32px; color: var(--accent); font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; font-size: 13px;
    }
    h1 { font-size: 28px; line-height: 1.2; margin: 8px 0 20px; }
    .card { background: var(--card); border-radius: 16px; padding: 20px; }
    .muted { color: var(--muted); font-size: 15px; margin: 0; }
    .code {
      font-size: 40px; font-weight: 800; color: var(--accent); letter-spacing: 0.08em;
      margin: 6px 0 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
    }
    .buttons { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
    a.btn {
      display: block; text-align: center; text-decoration: none; border-radius: 999px;
      padding: 14px 20px; font-weight: 700; font-size: 16px;
    }
    a.primary { background: var(--accent); color: #13201d; }
    a.secondary { border: 1px solid rgba(255, 255, 255, 0.6); color: var(--text); }
    .stores { display: flex; gap: 12px; }
    .stores a { flex: 1; }
    .stores a.soon { border-style: dashed; color: var(--muted); cursor: default; font-weight: 600; font-size: 14px; }
    .hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>
<main>
  <a class="brand" href="/">
    <img src="/favicon.svg" alt="">
    <span>Gym<span class="bar">Bar</span></span>
  </a>

  <div class="label" id="label"></div>
  <h1 id="title"></h1>
  <div class="card" id="card">
    <p class="muted" id="codeLabel"></p>
    <p class="code" id="code"></p>
  </div>

  <div class="buttons">
    <a class="btn primary" id="openApp" href="#"></a>
    <div class="stores">
      <a class="btn secondary" id="playStore" data-store="play" href="#">Google Play</a>
      <a class="btn secondary" id="appStore" data-store="apple" href="#">App Store</a>
    </div>
    <p class="hint" id="hint"></p>
  </div>
</main>

<script src="/config.js"></script>
<script src="/site.js"></script>
<script>
(function () {
  // friend = pozvánka mezi přátele, gym = žebříček posilovny,
  // coach = propojení s trenérem (?code=), plan = sdílený plán (?id=).
  var T = {
    en: {
      coachLabel: 'Coach', coachTitle: 'Connect with me in GymBar – I’ll send you training plans',
      planLabel: 'Training plan', planTitle: 'Open this training plan in GymBar',
      friendLabel: 'Friend invite', friendTitle: 'Add me as a friend in GymBar',
      gymLabel: 'Gym leaderboard', gymTitle: 'Join our gym leaderboard in GymBar',
      code: 'Code', open: 'Open in app',
      hint: "Don't have the app yet? Get it, then open this link again or enter the code in the app.",
      invalid: "This invite link doesn't work."
    },
    cs: {
      coachLabel: 'Trenér', coachTitle: 'Propoj se se mnou v GymBaru – budu ti posílat plány',
      planLabel: 'Tréninkový plán', planTitle: 'Otevři si tenhle tréninkový plán v GymBaru',
      friendLabel: 'Pozvánka', friendTitle: 'Přidej si mě mezi přátele v GymBaru',
      gymLabel: 'Žebříček posilovny', gymTitle: 'Přidej se do žebříčku naší posilovny v GymBaru',
      code: 'Kód', open: 'Otevřít v aplikaci',
      hint: 'Aplikaci ještě nemáš? Stáhni si ji a pak otevři tenhle odkaz znovu nebo zadej kód v aplikaci.',
      invalid: 'Tenhle odkaz na pozvánku nefunguje.'
    },
    sk: {
      coachLabel: 'Tréner', coachTitle: 'Prepoj sa so mnou v GymBare – budem ti posielať plány',
      planLabel: 'Tréningový plán', planTitle: 'Otvor si tento tréningový plán v GymBare',
      friendLabel: 'Pozvánka', friendTitle: 'Pridaj si ma medzi priateľov v GymBare',
      gymLabel: 'Rebríček posilňovne', gymTitle: 'Pridaj sa do rebríčka našej posilňovne v GymBare',
      code: 'Kód', open: 'Otvoriť v aplikácii',
      hint: 'Aplikáciu ešte nemáš? Stiahni si ju a potom otvor tento odkaz znova alebo zadaj kód v aplikácii.',
      invalid: 'Tento odkaz na pozvánku nefunguje.'
    },
    de: {
      coachLabel: 'Coach', coachTitle: 'Verbinde dich mit mir in GymBar – ich schicke dir Trainingspläne',
      planLabel: 'Trainingsplan', planTitle: 'Öffne diesen Trainingsplan in GymBar',
      friendLabel: 'Einladung', friendTitle: 'Füg mich in GymBar als Freund hinzu',
      gymLabel: 'Studio-Rangliste', gymTitle: 'Tritt der Rangliste unseres Studios in GymBar bei',
      code: 'Code', open: 'In der App öffnen',
      hint: 'Du hast die App noch nicht? Lade sie herunter und öffne den Link dann erneut oder gib den Code in der App ein.',
      invalid: 'Dieser Einladungslink funktioniert nicht.'
    },
    es: {
      coachLabel: 'Entrenador', coachTitle: 'Conéctate conmigo en GymBar: te enviaré planes de entrenamiento',
      planLabel: 'Plan de entrenamiento', planTitle: 'Abre este plan de entrenamiento en GymBar',
      friendLabel: 'Invitación', friendTitle: 'Agrégame como amigo en GymBar',
      gymLabel: 'Ranking del gimnasio', gymTitle: 'Únete al ranking de nuestro gimnasio en GymBar',
      code: 'Código', open: 'Abrir en la app',
      hint: '¿Aún no tienes la app? Descárgala y vuelve a abrir este enlace o introduce el código en la app.',
      invalid: 'Este enlace de invitación no funciona.'
    },
    fr: {
      coachLabel: 'Coach', coachTitle: 'Connecte-toi à moi sur GymBar : je t’enverrai des programmes',
      planLabel: 'Programme', planTitle: 'Ouvre ce programme d’entraînement dans GymBar',
      friendLabel: 'Invitation', friendTitle: 'Ajoute-moi en ami sur GymBar',
      gymLabel: 'Classement de la salle', gymTitle: 'Rejoins le classement de notre salle sur GymBar',
      code: 'Code', open: "Ouvrir dans l'app",
      hint: "Tu n'as pas encore l'app ? Télécharge-la puis rouvre ce lien ou saisis le code dans l'app.",
      invalid: "Ce lien d'invitation ne fonctionne pas."
    },
    it: {
      coachLabel: 'Coach', coachTitle: 'Collegati a me su GymBar: ti invierò le schede di allenamento',
      planLabel: 'Scheda di allenamento', planTitle: 'Apri questa scheda di allenamento su GymBar',
      friendLabel: 'Invito', friendTitle: 'Aggiungimi agli amici su GymBar',
      gymLabel: 'Classifica della palestra', gymTitle: 'Entra nella classifica della nostra palestra su GymBar',
      code: 'Codice', open: "Apri nell'app",
      hint: "Non hai ancora l'app? Scaricala e poi riapri questo link o inserisci il codice nell'app.",
      invalid: "Questo link d'invito non funziona."
    },
    nl: {
      coachLabel: 'Coach', coachTitle: 'Verbind met mij in GymBar – ik stuur je trainingsschema’s',
      planLabel: 'Trainingsschema', planTitle: 'Open dit trainingsschema in GymBar',
      friendLabel: 'Uitnodiging', friendTitle: 'Voeg me toe als vriend in GymBar',
      gymLabel: 'Ranglijst van de sportschool', gymTitle: 'Doe mee aan de ranglijst van onze sportschool in GymBar',
      code: 'Code', open: 'Openen in de app',
      hint: 'Heb je de app nog niet? Download hem en open deze link daarna opnieuw of voer de code in de app in.',
      invalid: 'Deze uitnodigingslink werkt niet.'
    },
    pl: {
      coachLabel: 'Trener', coachTitle: 'Połącz się ze mną w GymBar – będę ci wysyłać plany treningowe',
      planLabel: 'Plan treningowy', planTitle: 'Otwórz ten plan treningowy w GymBar',
      friendLabel: 'Zaproszenie', friendTitle: 'Dodaj mnie do znajomych w GymBar',
      gymLabel: 'Ranking siłowni', gymTitle: 'Dołącz do rankingu naszej siłowni w GymBar',
      code: 'Kod', open: 'Otwórz w aplikacji',
      hint: 'Nie masz jeszcze aplikacji? Pobierz ją, a potem otwórz ten link ponownie lub wpisz kod w aplikacji.',
      invalid: 'Ten link z zaproszeniem nie działa.'
    },
    pt: {
      coachLabel: 'Treinador', coachTitle: 'Conecte-se comigo no GymBar – vou te enviar planos de treino',
      planLabel: 'Plano de treino', planTitle: 'Abra este plano de treino no GymBar',
      friendLabel: 'Convite', friendTitle: 'Me adicione como amigo no GymBar',
      gymLabel: 'Ranking da academia', gymTitle: 'Entre no ranking da nossa academia no GymBar',
      code: 'Código', open: 'Abrir no app',
      hint: 'Ainda não tem o app? Baixe e depois abra este link de novo ou digite o código no app.',
      invalid: 'Este link de convite não funciona.'
    }
  };

  function pickLang() {
    var langs = navigator.languages && navigator.languages.length
      ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < langs.length; i++) {
      var c = String(langs[i] || '').toLowerCase().split('-')[0];
      if (T[c]) return c;
    }
    return 'en';
  }

  var lang = pickLang();
  var t = T[lang];
  document.documentElement.lang = lang;
  function text(id, value) { document.getElementById(id).textContent = value; }

  // /friend nebo /gym (i s koncovým lomítkem nebo .html).
  var kind = window.location.pathname.replace(/\/+$/, '').replace(/\.html$/, '')
    .split('/').pop();
  // Kódy z aplikace: velká písmena a číslice bez snadno zaměnitelných znaků.
  var code = (new URLSearchParams(window.location.search).get('code') || '')
    .trim().toUpperCase();
  var planId = (new URLSearchParams(window.location.search).get('id') || '').trim();
  var valid = kind === 'plan'
    ? /^[A-Za-z0-9]{10,40}$/.test(planId)
    : (kind === 'friend' || kind === 'gym' || kind === 'coach') && /^[A-Z0-9]{4,12}$/.test(code);

  text('hint', t.hint);
  // Odkazy do obchodů, nebo „již brzy“ podle config.js.
  window.GYMBAR.storeButtons(lang);

  if (!valid) {
    text('title', t.invalid);
    document.getElementById('card').style.display = 'none';
    document.getElementById('openApp').style.display = 'none';
    return;
  }

  text('label', t[kind + 'Label']);
  text('title', t[kind + 'Title']);
  document.title = document.getElementById('title').textContent;
  text('openApp', t.open);
  if (kind === 'plan') {
    document.getElementById('card').style.display = 'none';
    document.getElementById('openApp').href =
      window.GYMBAR.scheme + '://plan?id=' + encodeURIComponent(planId);
    return;
  }
  text('codeLabel', t.code);
  text('code', code);
  document.getElementById('openApp').href =
    window.GYMBAR.scheme + '://' + kind + '?code=' + encodeURIComponent(code);
})();
</script>
</body>
</html>
