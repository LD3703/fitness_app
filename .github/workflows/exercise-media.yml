# Obrázky cviků z wger.de (tool/wger_import.dart) – JEN RUČNĚ:
# Actions → „Obrázky cviků (wger.de)“ → Run workflow → vybrat větev (ne main).
#
# Stáhne obrázky do assets/exercises/, zapíše tool/media/wger_media.json
# (autoři kvůli licenci CC BY-SA), lib/data/seed/exercise_media.dart
# a tool/wger_report.csv a výsledek commitne do vybrané větve. Do main
# nezapisuje – změna jde do main přes pull request (zkontroluj report).
name: Obrázky cviků (wger.de)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    name: Import z wger.de
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Jen mimo main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "::error::Spusť na jiné větvi než main – výsledek jde do main přes pull request."
          exit 1
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart run tool/wger_import.dart
      # Obrázky z wger.de mají i 8 MB – zmenšit na nejvýš 720 px (stačí
      # i na tabletu), bez metadat, PNG ztrátově přes pngquant. GIF a WebP
      # zůstávají (můžou být animované).
      - name: Zmenšení obrázků
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick pngquant >/dev/null
          du -sh assets/exercises
          find assets/exercises -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) \
            -exec mogrify -resize '720x720>' -strip -quality 85 {} +
          find assets/exercises -type f -iname '*.png' \
            -exec pngquant --force --skip-if-larger --ext .png --quality 65-90 {} + || true
          du -sh assets/exercises
      - name: Commit výsledku
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A assets/exercises tool/media lib/data/seed/exercise_media.dart tool/wger_report.csv
          if git diff --cached --quiet; then
            echo "Žádné změny."
            exit 0
          fi
          git commit -m "Obrázky cviků z wger.de (tool/wger_import.dart)"
          git push
